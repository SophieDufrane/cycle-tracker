name: Deploy to Scaleway Serverless Containers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone your project repository code into the runner
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Build the Docker image locally and push it to the Scaleway Container Registry
      - name: Build and Push Docker Image
        run: |
          docker login rg.fr-par.scw.cloud -u nologin -p "${{ secrets.SCW_SECRET_KEY }}"
          docker build -t rg.fr-par.scw.cloud/soso-studio-backend/cycle-calculator-api:latest ./backend
          docker push rg.fr-par.scw.cloud/soso-studio-backend/cycle-calculator-api:latest

      # Step 3: Automatically fetch the Container ID and trigger the deployment via Scaleway API
      - name: Deploy to Scaleway Serverless
        run: |
          echo "🔍 Fetching container ID..."

          # 1. Dynamically retrieve the Container ID based on its exact name
          CONTAINER_ID=$(curl --silent \
            --header "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
            "https://scaleway.com" \
            | jq -r '.containers[0].id')

          if [ "$CONTAINER_ID" = "null" ] || [ -z "$CONTAINER_ID" ]; then
            echo "❌ Error: Could not find any container named 'cycle-calculator-api' on Scaleway."
            exit 1
          fi

          echo "✅ Container found (ID: $CONTAINER_ID). Triggering redeployment..."

          # 2. Trigger the redeployment via the official endpoint using the POST method
          curl --silent --fail --show-error --request POST \
            --header "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
            --header "Content-Type: application/json" \
            "https://scaleway.com"
