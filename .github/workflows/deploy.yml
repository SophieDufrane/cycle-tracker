name: Deploy to Scaleway Serverless Containers

on:
  push:
    branches:
      - main

env:
  IMAGE: rg.fr-par.scw.cloud/soso-studio-backend/cycle-calculator-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Scaleway Container Registry
        run: echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud -u nologin --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

      - name: Redeploy Scaleway container
        run: |
          curl --silent --fail --show-error --request PATCH \
            --header "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
            --header "Content-Type: application/json" \
            --data "{\"registry_image\": \"$IMAGE\"}" \
            "https://api.scaleway.com/containers/v1/regions/fr-par/containers/${{ secrets.SCW_CONTAINER_ID }}"
