name: Deploy to Scaleway Serverless Containers

on:
  push:
    branches:
      - main

env:
  IMAGE: rg.fr-par.scw.cloud/soso-studio-backend/cycle-calculator-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
          registry: rg.fr-par.scw.cloud

      - name: Build the Docker image
        run: docker build . -t "$IMAGE"

      - name: Push the Docker image
        run: docker push "$IMAGE"

      - name: Redeploy Scaleway container
        run: |
          curl --silent --fail --show-error --request PATCH \
            --header "X-Auth-Token: ${{ secrets.SCW_SECRET_KEY }}" \
            --header "Content-Type: application/json" \
            --data "{\"image\": \"$IMAGE\"}" \
            "https://api.scaleway.com/containers/v1/regions/fr-par/containers/${{ secrets.SCW_CONTAINER_ID }}"
